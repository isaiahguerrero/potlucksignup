<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Y2K Potluck Sign-Up</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #faf8f5;
    color: #2c2a26;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.sub { color: #6b6862; margin-top: 0; margin-bottom: 24px; }
  h2.section-title { font-size: 17px; margin: 28px 0 12px; color: #2c2a26; }
  .card {
    background: #fff;
    border: 1px solid #e7e3da;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .entry-name { font-weight: 600; font-size: 15px; }
  .entry-food { font-size: 14px; margin-top: 2px; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  button {
    background: #8a5a2b;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #714a22; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    background: #fff;
    color: #8a5a2b;
    border: 1px solid #d8c4a8;
  }
  button.secondary:hover { background: #f5efe4; }
  button.danger {
    background: #fff;
    color: #a33a2a;
    border: 1px solid #e0b6ab;
  }
  button.danger:hover { background: #fdf0ee; }
  .empty { color: #9a9184; font-style: italic; text-align: center; padding: 20px 0; }
  .form-card {
    background: #fff;
    border: 1px solid #e7e3da;
    border-radius: 12px;
    padding: 16px;
  }
  .form-title { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .form-hint { font-size: 12px; color: #9a9184; margin-bottom: 8px; }
  label { font-size: 13px; color: #6b6862; display: block; margin-bottom: 4px; margin-top: 10px; }
  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d8d2c4;
    border-radius: 8px;
    font-size: 14px;
  }
  .form-buttons { margin-top: 14px; display: flex; gap: 8px; }
  #status { font-size: 13px; color: #6b6862; margin-top: 10px; min-height: 18px; }
  .radios { display: flex; gap: 16px; margin-top: 10px; }
  .radios label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; color: #2c2a26; }
  .radios input { width: auto; }
  .columns { display: flex; gap: 16px; }
  .column { flex: 1; min-width: 0; }
  .column-title { font-size: 14px; font-weight: 700; color: #8a5a2b; margin-bottom: 10px; }
  @media (max-width: 480px) {
    .columns { flex-direction: column; }
  }
</style>
</head>
<body>

<h1>🪩 2000's/Y2K Potluck Sign-Up</h1>
<p class="sub">Add your name, what you're bringing, and whether it's food or a drink.</p>

<div class="form-card">
  <div class="form-title" id="formTitle">Add yourself</div>
  <label for="fName">Your name</label>
  <input type="text" id="fName" placeholder="e.g. Isaiah">
  <label for="fFood">What you're bringing</label>
  <input type="text" id="fFood" placeholder="e.g. Elote pasta salad">
  <div class="radios">
    <label><input type="radio" name="fCategory" value="food" checked> Food</label>
    <label><input type="radio" name="fCategory" value="drink"> Drink</label>
  </div>
  <div class="form-buttons">
    <button onclick="submitEntry()" id="submitBtn">Add</button>
    <button class="secondary" style="display:none" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
  </div>
</div>

<h2 class="section-title">What people are bringing so far</h2>
<div class="columns">
  <div class="column">
    <div class="column-title">Food 🍕</div>
    <div id="foodBoard"><div class="empty">Loading…</div></div>
  </div>
  <div class="column">
    <div class="column-title">Drinks 🍺</div>
    <div id="drinkBoard"><div class="empty">Loading…</div></div>
  </div>
</div>

<div id="status"></div>

<script>
/* ====== CONFIGURE THIS ONE VALUE ======
   Paste your Firebase Realtime Database URL below.
   Find it in the Firebase console: Build -> Realtime Database
   Looks like: https://your-project-default-rtdb.firebaseio.com
*/
const DATABASE_URL = "https://isaiah-potluck-default-rtdb.firebaseio.com";
/* ======================================= */

const ENTRIES_URL = `${DATABASE_URL}/entries.json`;

let entries = {}; // keyed by firebase-generated id
let editingId = null;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
  setTimeout(() => { document.getElementById('status').textContent = ''; }, 3000);
}

async function loadEntries() {
  try {
    const res = await fetch(ENTRIES_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("Failed to load: " + res.status);
    const data = await res.json();
    entries = data || {};
  } catch (e) {
    console.error(e);
    setStatus("Couldn't load the sign-up list. Check the setup at the top of this file.");
    entries = {};
  }
  render();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderColumn(board, ids) {
  board.innerHTML = "";
  if (ids.length === 0) {
    board.innerHTML = '<div class="empty">Nothing yet!</div>';
    return;
  }
  ids.forEach(id => {
    const e = entries[id];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="entry-top">
        <div>
          <div class="entry-name">${escapeHtml(e.name)}</div>
          <div class="entry-food">${escapeHtml(e.food)}</div>
        </div>
        <div class="actions">
          <button class="secondary" data-action="edit" data-id="${id}">Edit</button>
          <button class="danger" data-action="delete" data-id="${id}">Delete</button>
        </div>
      </div>
    `;
    board.appendChild(card);
  });

  board.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.onclick = () => requestEdit(btn.dataset.id);
  });
  board.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.onclick = () => requestDelete(btn.dataset.id);
  });
}

function render() {
  const ids = Object.keys(entries);
  const foodIds = ids.filter(id => entries[id].category !== 'drink');
  const drinkIds = ids.filter(id => entries[id].category === 'drink');
  renderColumn(document.getElementById('foodBoard'), foodIds);
  renderColumn(document.getElementById('drinkBoard'), drinkIds);
}

function requestEdit(id) {
  const e = entries[id];
  if (!e) return;
  editingId = id;
  document.getElementById('fName').value = e.name;
  document.getElementById('fFood').value = e.food;
  const cat = e.category === 'drink' ? 'drink' : 'food';
  document.querySelector(`input[name="fCategory"][value="${cat}"]`).checked = true;
  document.getElementById('formTitle').textContent = 'Edit your entry';
  document.getElementById('submitBtn').textContent = 'Save changes';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null;
  document.getElementById('fName').value = '';
  document.getElementById('fFood').value = '';
  document.querySelector('input[name="fCategory"][value="food"]').checked = true;
  document.getElementById('formTitle').textContent = 'Add yourself';
  document.getElementById('submitBtn').textContent = 'Add';
  document.getElementById('cancelBtn').style.display = 'none';
}

function setFormDisabled(disabled) {
  document.getElementById('submitBtn').disabled = disabled;
}

async function submitEntry() {
  const name = document.getElementById('fName').value.trim();
  const food = document.getElementById('fFood').value.trim();
  const category = document.querySelector('input[name="fCategory"]:checked').value;

  if (!name || !food) {
    setStatus("Enter your name and what you're bringing.");
    return;
  }

  setFormDisabled(true);
  const payload = { name, food, category };

  try {
    if (editingId) {
      const res = await fetch(`${DATABASE_URL}/entries/${editingId}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Update failed: " + res.status);
      entries[editingId] = payload;
      setStatus("Updated.");
    } else {
      const res = await fetch(ENTRIES_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Add failed: " + res.status);
      const data = await res.json();
      entries[data.name] = payload; // firebase returns { name: "-Nxxxx" } as the new id
      setStatus("Added.");
    }
  } catch (e) {
    console.error(e);
    setStatus("Couldn't save. Check the setup at the top of this file.");
  }

  setFormDisabled(false);
  cancelEdit();
  render();
}

async function requestDelete(id) {
  const e = entries[id];
  if (!e) return;
  if (!confirm("Remove this entry?")) return;

  try {
    const res = await fetch(`${DATABASE_URL}/entries/${id}.json`, { method: "DELETE" });
    if (!res.ok) throw new Error("Delete failed: " + res.status);
    delete entries[id];
    setStatus("Removed.");
  } catch (e) {
    console.error(e);
    setStatus("Couldn't delete. Check the setup at the top of this file.");
  }
  render();
}

loadEntries();
</script>

</body>
</html>
